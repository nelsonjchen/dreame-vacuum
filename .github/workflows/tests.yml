name: Mocked lifecycle tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.14
      - run: uv pip install -r requirements-test.txt
      - run: .venv/bin/python -m pytest -q
